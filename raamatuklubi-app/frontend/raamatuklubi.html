<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raamatuklubi</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f4f4f4; }
        header { background: #2c3e50; color: white; padding: 1rem; text-align: center; }
        main { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
        section { background: white; padding: 1.5rem; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; margin-bottom: 1rem; border-bottom: 2px solid #3498db; padding-bottom: 0.5rem; }
        .book-card { border: 1px solid #ddd; padding: 1rem; margin-bottom: 1rem; border-radius: 5px; }
        .book-card h3 { color: #3498db; }
        button { background: #3498db; color: white; border: none; padding: 0.5rem 1rem; border-radius: 3px; cursor: pointer; }
        button:hover { background: #2980b9; }
        input, select { padding: 0.5rem; margin: 0.25rem; border: 1px solid #ddd; border-radius: 3px; }
        form { display: flex; flex-direction: column; gap: 0.5rem; margin-top: 1rem; }
        .delete-btn { background: #e74c3c; margin-top: 0.5rem; }
        .event-item { background: #ecf0f1; padding: 0.8rem; margin-bottom: 0.5rem; border-radius: 5px; }
        @media (max-width: 768px) { main { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <header><h1>📚 Raamatuklubi</h1><p>TTHK projekt</p></header>
    <main>
        <section>
            <h2>📖 Raamatud</h2>
            <div id="books-list"></div>
            <h3>➕ Lisa raamat</h3>
            <form id="add-book-form">
                <input type="text" id="title" placeholder="Pealkiri" required>
                <input type="text" id="author" placeholder="Autor" required>
                <input type="number" id="year" placeholder="Aasta">
                <input type="text" id="genre" placeholder="Žanr">
                <button type="submit">Lisa</button>
            </form>
        </section>
        <section>
            <h2>🗓️ Üritused</h2>
            <div id="events-list"></div>
            <h3>➕ Lisa üritus</h3>
            <form id="add-event-form">
                <input type="text" id="event-title" placeholder="Nimi" required>
                <input type="date" id="event-date" required>
                <input type="text" id="event-location" placeholder="Asukoht" required>
                <button type="submit">Lisa</button>
            </form>
        </section>
    </main>
    <script>
        const API = 'http://localhost:3000/api';
        
        async function loadBooks() {
            const res = await fetch(`${API}/books`);
            const books = await res.json();
            document.getElementById('books-list').innerHTML = books.map(book => `
                <div class="book-card">
                    <h3>${book.title}</h3>
                    <p><strong>${book.author}</strong> (${book.year}) - ${book.genre}</p>
                    <button class="delete-btn" data-id="${book.id}">🗑️ Kustuta</button>
                </div>
            `).join('');
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.onclick = () => fetch(`${API}/books/${btn.dataset.id}`, { method: 'DELETE' }).then(() => loadBooks());
            });
        }
        
        document.getElementById('add-book-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            await fetch(`${API}/books`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    title: document.getElementById('title').value,
                    author: document.getElementById('author').value,
                    year: parseInt(document.getElementById('year').value),
                    genre: document.getElementById('genre').value
                })
            });
            e.target.reset();
            loadBooks();
        });
        
        async function loadEvents() {
            const res = await fetch(`${API}/events`);
            const events = await res.json();
            document.getElementById('events-list').innerHTML = events.map(e => `
                <div class="event-item"><strong>${e.title}</strong><br>📅 ${e.date} | 📍 ${e.location}</div>
            `).join('');
        }
        
        document.getElementById('add-event-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            await fetch(`${API}/events`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    title: document.getElementById('event-title').value,
                    date: document.getElementById('event-date').value,
                    location: document.getElementById('event-location').value
                })
            });
            e.target.reset();
            loadEvents();
        });
        
        loadBooks();
        loadEvents();
    </script>
</body>
</html>
